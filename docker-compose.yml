# Lokaler Stack für Treasury Kompass (docs/architecture.md, Abschnitte 3, 11, 14, 15).
#
# Konfiguration: cp .env.example .env, Passwörter und Schlüssel eintragen.
# Die Services erhalten bewusst kein env_file: Jeder Container bekommt nur die Variablen,
# die er braucht (der agent-service kennt kein Superuser-Passwort, der treasury-service
# keine API-Schlüssel für Anthropic oder Voyage).
#
# AGENT_DB_PASSWORD wird in die Datenbank-URL des agent-service eingesetzt und muss deshalb
# URL-sicher sein (nur A-Z, a-z, 0-9, ".", "_", "~", "-"), z.B. openssl rand -hex 24.

name: treasury-kompass

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TREASURY_DB_PASSWORD: ${TREASURY_DB_PASSWORD:?TREASURY_DB_PASSWORD fehlt in .env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?AGENT_DB_PASSWORD fehlt in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Über TCP prüfen: Während der Init-Skripte lauscht Postgres nur auf dem Unix-Socket.
      # So wird der Container erst gesund, wenn Rollen und Schemas angelegt sind.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [tk]
    restart: unless-stopped

  treasury-service:
    build: ./services/treasury-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=treasury
      SPRING_DATASOURCE_USERNAME: treasury_app
      SPRING_DATASOURCE_PASSWORD: ${TREASURY_DB_PASSWORD}
      TREASURY_AGENT_BASE_URL: http://agent-service:8000
      TREASURY_INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY fehlt in .env}
      TREASURY_UPLOAD_MAX_BYTES: ${TREASURY_UPLOAD_MAX_BYTES:-20971520}
      TREASURY_UPLOAD_MAX_PAGES: ${TREASURY_UPLOAD_MAX_PAGES:-150}
      TREASURY_ADVISOR_ID: ${TREASURY_ADVISOR_ID:-advisor-demo}
      TREASURY_ADVISOR_NAME: ${TREASURY_ADVISOR_NAME:-Kundenberater Firmenkunden}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [tk]
    restart: unless-stopped

  agent-service:
    build: ./services/agent-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_FALLBACKS: ${ANTHROPIC_FALLBACKS:-default}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4}
      AGENT_DATABASE_URL: postgresql+psycopg://agent_app:${AGENT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENT_TREASURY_BASE_URL: http://treasury-service:8080
      AGENT_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AGENT_EXTRACTION_FULL_DOC_MAX_PAGES: ${AGENT_EXTRACTION_FULL_DOC_MAX_PAGES:-40}
      AGENT_RAG_TOP_K: ${AGENT_RAG_TOP_K:-6}
      AGENT_CHAT_MAX_MODEL_CALLS: ${AGENT_CHAT_MAX_MODEL_CALLS:-8}
      AGENT_CHAT_MAX_PROPOSALS: ${AGENT_CHAT_MAX_PROPOSALS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [tk]
    restart: unless-stopped

  gateway:
    image: nginx:1.30.6-alpine
    depends_on: [treasury-service, agent-service]
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist/treasury-kompass/browser:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:80"
    networks: [tk]
    restart: unless-stopped

networks:
  tk: {}

volumes:
  pgdata: {}
