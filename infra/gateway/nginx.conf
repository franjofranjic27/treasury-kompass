# Gateway für Treasury Kompass (docs/architecture.md, Abschnitte 3, 12 und 14).
# Wird als /etc/nginx/conf.d/default.conf eingebunden, steht also im http-Kontext der
# nginx.conf des Images.
#
#   /api/       -> treasury-service:8080
#   /agent/     -> agent-service:8000 (SSE, ungepuffert)
#   /internal/  -> 404 (nur Service-zu-Service im Compose-Netz)
#   /actuator/  -> 404
#   /           -> gebautes Frontend, SPA-Fallback auf index.html

# Docker-DNS. Mit "resolve" in den upstreams startet nginx auch dann, wenn ein Service
# (noch) nicht läuft, und folgt neuen Container-IPs nach einem Neustart.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream treasury_service {
    zone treasury_service 64k;
    server treasury-service:8080 resolve;
    keepalive 16;
}

upstream agent_service {
    zone agent_service 64k;
    server agent-service:8000 resolve;
    keepalive 16;
}

# Pfade mit ";", Backslash oder kodierten Punkten, Slashes und Backslashes ablehnen. nginx routet
# nach dem normalisierten Pfad, reicht aber den Original-Pfad weiter. Tomcat entfernt
# Pfadparameter (";…") erst danach, so würde z.B. "/api/..;/internal/" hinter dem Gateway zu
# "/internal/". Die APIs brauchen keines dieser Zeichen im Pfad (Query-String bleibt frei).
map $request_uri $tk_suspicious_path {
    default                            0;
    "~^[^?]*(;|\x5c|%2[eEfF]|%5[cC])"  1;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    if ($tk_suspicious_path) {
        return 400;
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://treasury_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Der Service-Schlüssel gehört nur ins interne Netz, nie zum Browser.
        proxy_set_header X-Service-Key "";
    }

    location /agent/ {
        proxy_pass http://agent_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Service-Key "";

        # Server-Sent Events: jedes Token sofort weiterreichen, lange Turns zulassen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
