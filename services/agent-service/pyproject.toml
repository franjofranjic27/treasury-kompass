[project]
name = "agent-service"
version = "0.1.0"
description = "Treasury Kompass agent-service: PDF-Ingest, Extraktion mit Fundstellen und Chat-Agent für Firmenkundenberater"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.164.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "langchain>=1.5.0,<2",
    "langchain-core>=1.8.2,<2",
    "langchain-anthropic>=1.7.11,<2",
    "anthropic>=2.10.0,<3",
    "langgraph>=1.2.22,<2",
    "voyageai>=0.6.0,<1",
    "langchain-text-splitters>=1.1.3,<2",
    "pypdf>=7.1.1,<8",
    "sqlalchemy[asyncio]>=2.1.9,<3",
    "psycopg[binary]>=3.3.9,<4",
    "pgvector>=0.5.1,<1",
    "sse-starlette>=3.7.0,<4",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "respx>=0.23.1,<1",
    "ruff>=0.17.5,<1",
    "testcontainers[postgres]>=4.15.0,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PT", "RET", "TC"]
ignore = [
    "RUF001", # German typography (« », –, …) is intended in texts
    "RUF002",
    "RUF003",
    "TC001", # runtime imports of types are needed by pydantic and FastAPI
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers with pgvector)"]
